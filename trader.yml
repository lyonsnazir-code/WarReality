name: Polymarket Trader

on:
  workflow_dispatch: # Allows manual triggers
  schedule:
    - cron: '*/30 * * * *' # Optional: runs automatically every 30 minutes

jobs:
  run-trader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run automated trader script
        env:
          GAMMA_API_KEY: ${{ secrets.GAMMA_API_KEY }}
          # Add any other required private keys or API variables here
        run: |
          python autonomous_trader.py